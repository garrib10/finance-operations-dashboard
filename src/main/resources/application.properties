# Application
spring.application.name=finance-operations-dashboard

# Authorization
springdoc.swagger-ui.persistAuthorization=false

# Frontend / CORS
# Defaults to the local Vite frontend.
# Production and staging origins will be provided through FRONTEND_URLS on Railway.
app.frontend-urls=${FRONTEND_URLS:http://localhost:5173}

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Error Handling
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}
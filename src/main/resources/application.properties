# Application
spring.application.name=finance-operations-dashboard

# Authorization
springdoc.swagger-ui.persistAuthorization=false

# Frontend / CORS
# Defaults to the local Vite frontend.
# Production and staging origins will be provided through FRONTEND_URLS on Railway.
app.frontend-urls=${FRONTEND_URLS:http://localhost:5173}

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Error Handling
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}

# Validation exceptions contain rejected values, including passwords.
# Keep this resolver above DEBUG even when broader web diagnostics are enabled.
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=INFO
# Argument-resolution parse errors can include unquoted credential values.
logging.level.org.springframework.web.method.HandlerMethod=INFO

# Profile photo uploads (disabled unless explicitly configured).
app.profile-photo.enabled=${PROFILE_PHOTOS_ENABLED:false}
app.profile-photo.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.profile-photo.api-key=${CLOUDINARY_API_KEY:}
app.profile-photo.api-secret=${CLOUDINARY_API_SECRET:}
app.profile-photo.key-prefix=${PROFILE_PHOTO_KEY_PREFIX:}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
# Drain modestly oversized rejected requests so clients can receive the JSON 413.
# Keep this bounded: much larger requests may still be disconnected by Tomcat.
server.tomcat.max-swallow-size=4MB

# Provider HTTP diagnostics may contain multipart credentials or image bytes.
logging.level.com.cloudinary=OFF
logging.level.org.apache.hc.client5.http=OFF
logging.level.org.apache.hc.core5.http=OFF

# Response-body diagnostics can include public photo URLs and account details.
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor=INFO

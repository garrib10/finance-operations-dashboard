# ==============================
# Production Configuration
# ==============================

# Railway provides the application port through the PORT environment variable.
server.port=${PORT:8080}

# Disable verbose Hibernate SQL output in production.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable Swagger/OpenAPI documentation in production.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Refresh cookies are always Secure outside local development.
app.auth-session.refresh-cookie-secure=true

# Monitoring (issue #20). Every signed-in user is an ordinary customer (there is no
# operator role), so production shows health status only, to everyone, and exposes no
# metrics or info endpoints. Detailed health and metrics are for local diagnosis.
management.endpoints.web.exposure.include=health
management.endpoint.info.access=none
management.endpoint.metrics.access=none
management.endpoint.health.show-components=never
management.endpoint.health.show-details=never

# Structured logs (issue #20, Phase 2): one JSON object per line in Spring Boot's built-in
# Logstash format, so Railway can read "level" and "message" and keep stack traces inside
# the line. Includes the correlationId and any key-value fields. No extra dependency.
logging.structured.format.console=logstash
# Keep a failure's stack trace bounded in a single log line.
logging.structured.json.stacktrace.max-length=8192
# Production log levels: application and framework at INFO, never DEBUG or TRACE.
logging.level.root=INFO
logging.level.dev.portfolio.finance=INFO
# No SQL statements or bound parameter values (which hold user data).
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=OFF
# Security internals stay quiet; startup, database, and migration failures still log at WARN/ERROR.
logging.level.org.springframework.security=WARN
